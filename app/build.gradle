plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'antlr'
    id 'pmd'
}

configurations {
    pluginRuntime
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {

    implementation project(':api')

    pluginRuntime project(':penaltyplugin')
    pluginRuntime project(':teleportplugin')


    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava

    antlr 'org.antlr:antlr4:4.13.1'
    implementation 'org.antlr:antlr4-runtime:4.13.1'

    implementation 'org.python:jython-standalone:2.7.3'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'edu.curtin.game.PuzzleGame'
}

generateGrammarSource {
    arguments += ['-visitor', '-package', 'edu.curtin.game.parser']
    outputDirectory = file("build/generated-src/antlr/main/edu/curtin/game/parser")
}

compileJava.dependsOn generateGrammarSource

run {
    standardInput = System.in

    classpath += configurations.pluginRuntime
}

pmd {
    consoleOutput = true
    toolVersion = "7.15.0"
    rulesMinimumPriority = 5
    ruleSets = []
    ruleSetFiles = files("../saed-pmd-rules.xml")
}

